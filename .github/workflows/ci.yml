name: CI

# Pull requests as well as pushes, because a check that only runs after the
# push has already landed reports a problem that is already in main.
on:
  push:
    branches: [main]
  pull_request:

# The pre-commit hooks in .pre-commit-config.yaml run the same checks, and they
# are the faster feedback. What they cannot do is check a machine that is not
# yours: they depend on someone having run `make hooks`, and on the local
# environment being right. This repo's README tells strangers to
# `pipx install git+https://...`, so a clean-machine check has real value here.
env:
  # Matches the Makefile. Without it, uv re-resolves and rewrites uv.lock on
  # every invocation, baking in whichever index the environment points at.
  UV_FROZEN: 1

jobs:
  check:
    strategy:
      # Both ends of the supported range. `requires-python` says ">=3.10" and
      # the classifiers claim 3.10 through 3.14, and until this job existed
      # nothing had ever run the code on anything but the developer's 3.13 --
      # the floor was asserted, not tested.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      # No `--locked`: uv rejects it outright when UV_FROZEN is set, and the
      # whole workflow died on this line. UV_FROZEN means "use uv.lock as it is
      # and never write it" -- it does not check that uv.lock is still in sync
      # with pyproject.toml. The `lockfile` job below covers that with
      # `uv lock --check`.
      - run: uv sync --all-extras
      # `. ndive` and not just `.`: ruff's default include is *.py, so the
      # extensionless `ndive` script is skipped unless it is named.
      - run: uv run ruff check . ndive
      - run: uv run ruff format --check . ndive
      - run: uv run mypy neural_dive/
      - run: uv run pytest -q
      # test_content_integrity.py (TestQuestionNPCLinkage) covers the same
      # dangling/orphaned-question checks; validate_questions.py stays as a
      # `make validate` report tool but does not need its own CI step.

  lockfile:
    name: uv.lock is in sync and uses public PyPI only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # UV_FROZEN unset (not just empty -- uv 0.12 rejects "" as a boolish
      # value) and pointed at public PyPI, so this fails if uv.lock has drifted
      # from pyproject.toml, without writing the file or touching any mirror.
      - run: env -u UV_FROZEN UV_INDEX_URL=https://pypi.org/simple UV_DEFAULT_INDEX=https://pypi.org/simple uv lock --check
      - run: scripts/check-lockfile-index.sh
